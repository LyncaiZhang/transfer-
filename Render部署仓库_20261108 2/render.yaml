services:
  - type: web
    name: wenjin-public
    runtime: node
    plan: free
    rootDir: pages_app
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
